# Builds the Jekyll site and both Astro study sites into one GitHub Pages artifact.
# This branch is deployed directly and is not intended to merge into master.
# Requires Settings → Pages → Source: "GitHub Actions", and learn_golang allowed in the
# github-pages environment's deployment branch rules.
name: Deploy site

on:
  push:
    branches: [learn_golang]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            llvm-site/package-lock.json
            go-site/package-lock.json

      - name: Build study site
        working-directory: llvm-site
        run: |
          npm ci
          npm test
          npm run build
          npm run test:routes

      - name: Build Go study site
        working-directory: go-site
        run: |
          npm ci
          npm test
          npm run build
          npm run test:routes
          ./scripts/verify-solutions.sh

      - name: Combine outputs
        run: |
          test ! -e _site/llvm || { echo "_site/llvm already exists; refusing to overwrite"; exit 1; }
          test ! -e _site/learn-go || { echo "_site/learn-go already exists; refusing to overwrite"; exit 1; }
          cp -r llvm-site/dist _site/llvm
          cp -r go-site/dist _site/learn-go

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
