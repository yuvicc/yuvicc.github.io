      - checkout
steps:
  - If feedback arrives, reproduce the concern, revise and rerun relevant tests.
  - Otherwise perform a fresh self-review, reduce unnecessary code, verify the PR description and document one follow-up idea.
  - Avoid repeated review pings during this short window.
deliverable: A review-response log or a stronger self-reviewed patch with updated evidence.
