    section: The relevant implementation and two adjacent tests
    minutes: 40
steps:
  - Trace the reproducer to one checking or reporting path.
  - Write a proposed change and the cases it might affect.
  - If the issue needs unfamiliar template machinery or a large redesign, choose a smaller fallback now.
  - Ask a focused question only after recording your investigation.
deliverable: A patch hypothesis, candidate files and a boundary-case list; no speculative broad refactor.
