steps:
  - Reduce the failing program, remove unrelated includes, and record compiler SHA, target, flags and observed behavior.
  - Explain why the expected behavior is correct; another compiler is supporting evidence, not the specification.
  - For a documentation task, preserve the exact failing documented workflow.
deliverable: A minimal reproducer and a reasoned expected-versus-actual note.
